name: client
description: "Persian Transcriber — On-device, privacy-first local speech-to-text client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Native C++ Interop
  ffi: ^2.1.2

  # File System & Paths
  path_provider: ^2.1.3
  path: ^1.9.0

  # Model manifest integrity (SHA-256)
  crypto: ^3.0.3

  # Audio Utilities (Decoding / Formats)
  record: ^5.1.2

   # UI & Presentation
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/models/manifest.json

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
